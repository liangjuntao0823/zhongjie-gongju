name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: AgentTool

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' AgentTool.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/')
          BUILD=$(grep -m1 'CURRENT_PROJECT_VERSION' AgentTool.xcodeproj/project.pbxproj | sed 's/.*CURRENT_PROJECT_VERSION = \([^;]*\);.*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Version: $VERSION ($BUILD)"

      - name: Build for iOS (unsigned)
        run: |
          xcodebuild -project "AgentTool.xcodeproj" \
            -scheme "AgentTool" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AgentTool.app"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          IPA_NAME="AgentTool-v${VERSION}-b${BUILD}.ipa"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r "$IPA_NAME" Payload
            rm -rf Payload
            echo "IPA created: $IPA_NAME"
            ls -lh "$IPA_NAME"
            echo "ipa_name=$IPA_NAME" >> $GITHUB_OUTPUT
          else
            echo "App not found at $APP_PATH"
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
        id: package

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgentTool-ipa-v${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.ipa_name }}
          retention-days: 30
