name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build for iOS (unsigned)
        run: |
          xcodebuild -project "中介工具.xcodeproj" \
            -scheme "中介工具" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/中介工具.app"
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r "中介工具.ipa" Payload
            rm -rf Payload
            echo "IPA created successfully"
            ls -lh "中介工具.ipa"
          else
            echo "App not found at $APP_PATH"
            find build -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 中介工具-ipa
          path: 中介工具.ipa
          retention-days: 30
